name: Horosa Web validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/mobile-devserver-host
    paths:
      - '.github/workflows/horosa-web.yml'
      - 'local/workspace/Horosa-Web-55c75c5b088252fbd718afeffa6d5bcb59254a0c/astrostudyui/**'
  pull_request:
    paths:
      - '.github/workflows/horosa-web.yml'
      - 'local/workspace/Horosa-Web-55c75c5b088252fbd718afeffa6d5bcb59254a0c/astrostudyui/**'

permissions:
  contents: read

concurrency:
  group: horosa-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: local/workspace/Horosa-Web-55c75c5b088252fbd718afeffa6d5bcb59254a0c/astrostudyui
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: local/workspace/Horosa-Web-55c75c5b088252fbd718afeffa6d5bcb59254a0c/astrostudyui/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run browser migration regression suite
        run: >-
          npm test -- --runInBand --forceExit --testTimeout=30000 --runTestsByPath
          src/services/__tests__/aianalysisDocxExtraction.test.js
          src/layouts/__tests__/phase4gKeepMobile.test.js
          src/utils/__tests__/browserBootstrapNoLegacyBackend.test.js
          src/utils/__tests__/preciseCalcBridge.test.js
          src/utils/__tests__/browserNativeCalculationsNoRemoteFallback.test.js
          src/utils/__tests__/divinationTimeDraft.test.js
          src/utils/__tests__/phase4cZiweiLiureng.test.js
          src/utils/__tests__/phase4fAiDirectTransport.test.js
          src/utils/__tests__/pdPolesLocal.test.js
          src/components/dunjia/__tests__/DunJiaCalc.test.js
          src/components/jinkou/JinKouCalc.test.js
          src/components/jinkou/JinKouMain.test.js
          src/components/kinastro/__tests__/cetianTextsLocal.test.js
          src/components/taiyi/__tests__/TaiYiCore.test.js
          src/utils/__tests__/localchartsBcAd.test.js
          src/utils/__tests__/phase4hDeadDeps.test.js
          src/utils/__tests__/phase4iInstallerExit.test.js
          src/utils/__tests__/umiDevChunkMode.test.js
          src/constants/__tests__/ProductScope.test.js
      - name: Build browser application
        run: npm run build

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>PHASE 5-A WASM browser smoke</title>
</head>
<body>
	<p id="out">loading</p>
	<script type="module">
		const out = document.getElementById('out');
		try {
			const { openEphemeris } = await import('../browserEphemerisAdapter.js');
			const { nakshatrasForChart, nakshatraFromLon } = await import('../derived/nakshatraBrowser.js');
			const { fixedStarsCapability } = await import('../derived/fixedStarsCapability.js');
			const { calculateSu28 } = await import('../derived/su28Browser.js');
			const { qizhengMansionCapability } = await import('../derived/qizhengMansionCapability.js');
			const eph = await openEphemeris();
			const chart = eph.computeChart({
				year: 1990, month: 6, day: 15, hour: 10, minute: 30, second: 0, zoneOffsetHours: 8,
				lat: 31.233333333333334, lon: 121.46666666666667, hsysIndex: 2,
			});
			await eph.close();
			const payload = {
				ok: true,
				runtime: 'browser',
				initMs: eph.initMs,
				calcMs: chart.calcMs,
				jd: chart.jd,
				sun: chart.planets.Sun,
				asc: chart.houses.asc,
				mc: chart.houses.mc,
				wasm: typeof WebAssembly === 'object',
				nakshatraTropical: nakshatrasForChart({ zodiacal: 'Tropical', objects: { Sun: chart.planets.Sun && { lon: chart.planets.Sun.longitude } } }),
				nakshatraZero: nakshatraFromLon(0).name,
				fixedStars: fixedStarsCapability().status,
				su28Default: calculateSu28({ jd: chart.jd }).status,
				su28Mode4: calculateSu28({ jd: chart.jd }, 4).status,
				qizheng: qizhengMansionCapability().status,
			};
			out.textContent = JSON.stringify(payload);
			document.title = 'PHASE5A_SMOKE_OK';
		} catch (err) {
			out.textContent = String(err && err.stack ? err.stack : err);
			document.title = 'PHASE5A_SMOKE_FAIL';
		}
	</script>
</body>
</html>
